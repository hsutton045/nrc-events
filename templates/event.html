<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event {{event.event_number}}</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:35px auto;padding:0 20px;background:#f4f6f8}.card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 1px 6px #0001}.text{white-space:pre-wrap;line-height:1.5;background:#fafafa;border:1px solid #ddd;padding:14px;border-radius:9px}a{color:#1f6feb}</style></head><body><p><a href="{{back}}">← Back to search</a></p><div class="card"><h1>Event {{event.event_number}}</h1><p><b>Title:</b> {{event.title}}</p><p><b>Facility:</b> {{event.facility}} &nbsp; <b>State:</b> {{event.state}} &nbsp; <b>Date:</b> {{event.report_date}}</p><p><a href="{{event.report_url}}" target="_blank" rel="noopener">Original NRC page</a></p><h2>Event Text</h2><div class="text">{{event.event_text}}</div></div></body></html>
