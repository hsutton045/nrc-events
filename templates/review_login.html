<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Review Login</title><style>body{font:16px system-ui;background:#f3f6fa;color:#18283b;max-width:460px;margin:12vh auto;padding:20px}main{background:white;padding:30px;border-radius:14px;box-shadow:0 6px 30px #14243a18}input,button{box-sizing:border-box;width:100%;padding:12px;margin:10px 0;font:inherit}button{background:#174a78;color:white;border:0;border-radius:6px;cursor:pointer}.error{color:#b42318}</style><main><h1>Reliability study review</h1><p>Enter your private reviewer token to inspect and approve extracted numerical parameters.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><input name="token" type="password" required autocomplete="current-password" placeholder="Reviewer token"><button>Sign in</button></form></main></html>
